services:
  istsos4-gui:
    container_name: istsos4-gui
    network_mode: host
    build:
      context: ui
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - 2000:3000
    volumes:
      - ./ui/:/home/node/app
      - /home/node/app/node_modules
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_APP_URL}
      NEXT_PUBLIC_ISTSOS4_URL: ${NEXT_PUBLIC_ISTSOS4_URL}
      NEXT_PUBLIC_MAP_CENTER: ${NEXT_PUBLIC_MAP_CENTER}
      NEXT_PUBLIC_MAP_ZOOM: ${NEXT_PUBLIC_MAP_ZOOM}
      NEXT_PUBLIC_MAP_DEFAULT_BASEMAP: ${NEXT_PUBLIC_MAP_DEFAULT_BASEMAP}
      NEXT_PUBLIC_VERSIONING_ENABLED: ${NEXT_PUBLIC_VERSIONING_ENABLED:-false}
      # Host networking cannot resolve Docker service names.
      SAQC_SERVICE_URL: ${SAQC_SERVICE_URL:+http://127.0.0.1:8000}
    command: npm run dev

  saqc:
    profiles: [saqc]
    build: ./qc-service
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
