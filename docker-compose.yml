services:
  istsos4-gui:
    container_name: istsos4-gui
    image: ghcr.io/istsos/istsos4/gui:1.6
    restart: always
    ports:
      - 2000:3000
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_APP_URL}
      NEXT_PUBLIC_ISTSOS4_URL: ${NEXT_PUBLIC_ISTSOS4_URL}
      NEXT_PUBLIC_MAP_CENTER: ${NEXT_PUBLIC_MAP_CENTER}
      NEXT_PUBLIC_MAP_ZOOM: ${NEXT_PUBLIC_MAP_ZOOM}
      NEXT_PUBLIC_MAP_DEFAULT_BASEMAP: ${NEXT_PUBLIC_MAP_DEFAULT_BASEMAP}
      NEXT_PUBLIC_VERSIONING_ENABLED: ${NEXT_PUBLIC_VERSIONING_ENABLED:-false}
      RESULT_QUALITY_BITMASK_ENABLED: ${RESULT_QUALITY_BITMASK_ENABLED:-true}
      RESULT_QUALITY_CODES: ${RESULT_QUALITY_CODES:-}
      SAQC_SERVICE_URL: ${SAQC_SERVICE_URL:-}
    networks:
      - istsos4-network

  saqc:
    image: ghcr.io/istsos/istsos4/gui-saqc:1.0
    restart: always
    networks:
      - istsos4-network

networks:
  istsos4-network:
    external: true
